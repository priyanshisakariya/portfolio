<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="psGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#08090b"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#111318" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="22" fill="#6366f1" fill-opacity="0.12" filter="url(#glow)"/>
  <text x="32" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="url(#psGrad)" text-anchor="middle" letter-spacing="-0.5">PS</text>
  <circle cx="48" cy="16" r="3" fill="#10b981"/>
</svg>